name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find Gradle Wrapper
        id: gradle
        run: |
          WRAPPER=$(find . -name gradlew -not -path './.git/*' | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build JAR
        working-directory: .
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR Files
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: "**/build/libs/*.jar"
          if-no-files-found: error
